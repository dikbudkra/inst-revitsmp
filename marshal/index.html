<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Marshal - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>body { background-color: #0f172a; color: #f8fafc; }</style>
</head>
<body class="p-10 font-sans">
  
  <div id="loginBox" class="max-w-sm mx-auto bg-slate-800 p-8 rounded-xl shadow-xl border border-slate-700 mt-20">
    <h2 class="text-2xl font-bold mb-6 text-amber-400 text-center">Akses Admin</h2>
    <input type="text" id="aUser" placeholder="Username" class="w-full px-4 py-2 mb-4 bg-slate-700 rounded border border-slate-600 focus:outline-none focus:border-amber-400">
    <input type="password" id="aPass" placeholder="Password" class="w-full px-4 py-2 mb-6 bg-slate-700 rounded border border-slate-600 focus:outline-none focus:border-amber-400">
    <button onclick="loginAdmin()" class="w-full bg-blue-600 hover:bg-blue-500 py-2 rounded font-bold transition">Masuk Panel</button>
  </div>

  <div id="dashboard" class="max-w-5xl mx-auto hidden">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-white">Monitoring Progres Sekolah</h1>
      <button onclick="location.reload()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm">Keluar</button>
    </div>
    
    <div class="bg-slate-800 rounded-xl overflow-hidden shadow-lg border border-slate-700">
      <table class="w-full text-left text-sm">
        <thead class="bg-slate-900 text-slate-400">
          <tr>
            <th class="p-4">NPSN</th>
            <th class="p-4">Nama Instansi</th>
            <th class="p-4">Status Dokumen</th>
            <th class="p-4 text-right">Tindakan</th>
          </tr>
        </thead>
        <tbody id="tBody" class="divide-y divide-slate-700/50"></tbody>
      </table>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/GANTI_DENGAN_URL_GAS_ANDA/exec';

    async function reqGAS(data) {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(data) });
      return await res.json();
    }

    async function loginAdmin() {
      const u = document.getElementById('aUser').value;
      const p = document.getElementById('aPass').value;
      Swal.showLoading();
      const res = await reqGAS({ action: 'loginAdmin', username: u, password: p });
      if (res.status === 'success') {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadTable();
      } else {
        Swal.fire('Error', res.message, 'error');
      }
    }

    async function loadTable() {
      const res = await reqGAS({ action: 'adminList' });
      let html = '';
      res.data.forEach(s => {
        let badge = s.status === 'Selesai' ? 'bg-green-500/20 text-green-400 border border-green-500/50' : (s.status === 'Draf' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/50' : 'bg-slate-700 text-slate-400');
        let btn = s.status === 'Selesai' 
          ? `<button onclick="unlock('${s.npsn}')" class="text-xs bg-red-900/50 hover:bg-red-800 text-red-300 px-3 py-1.5 rounded mr-2 border border-red-700/50">Buka Kunci</button>
             <a href="${s.pdf_link}" target="_blank" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded">Buka Berkas</a>`
          : `<span class="text-slate-500 italic text-xs">Menunggu Finalisasi</span>`;
        
        html += `<tr class="hover:bg-slate-700/30 transition">
          <td class="p-4 text-slate-400">${s.npsn}</td>
          <td class="p-4 font-semibold text-slate-200">${s.nama_sekolah}</td>
          <td class="p-4"><span class="px-2 py-1 rounded text-[11px] uppercase tracking-wider font-bold ${badge}">${s.status}</span></td>
          <td class="p-4 text-right">${btn}</td>
        </tr>`;
      });
      document.getElementById('tBody').innerHTML = html;
      Swal.close();
    }

    async function unlock(npsn) {
      if(!confirm('Buka kunci form sekolah ini?')) return;
      Swal.showLoading();
      await reqGAS({ action: 'adminUnlock', npsn: npsn });
      loadTable();
    }
  </script>
</body>
</html>
