<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>e-Monev Revitalisasi Sekolah 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    .fade-in { animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Header Institusi (Desain Tengah/Center) -->
  <header class="bg-slate-800 border-b border-slate-700 py-5 px-6 flex flex-col items-center justify-center shadow-lg z-10 shrink-0 gap-3 relative overflow-hidden">
    <!-- Aksen Cahaya Belakang Logo -->
    <div class="absolute top-0 w-40 h-40 bg-amber-500/5 rounded-full blur-2xl"></div>
    
    <img src="https://lh3.googleusercontent.com/d/1e1LH5ZgYyLjclSNXwMAU5Zy_PKiju5z-" alt="Kabupaten Karanganyar" class="h-16 sm:h-20 object-contain drop-shadow-[0_4px_6px_rgba(0,0,0,0.5)] relative z-10">
    <h1 class="text-lg sm:text-2xl font-extrabold text-slate-100 tracking-wide text-center relative z-10">INSTRUMEN MONEV REVITALISASI SMP</h1>
  </header>

  <main class="flex-1 flex overflow-hidden relative">
    
    <!-- Halaman Login -->
    <div id="loginSection" class="absolute inset-0 z-20 bg-slate-900 flex items-center justify-center p-4">
      <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700 relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-2xl"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>
        
        <h2 class="text-2xl font-bold mb-2 text-center text-amber-400 relative z-10">Login Sekolah</h2>
        <p class="text-slate-400 text-sm text-center mb-6 relative z-10">Masukkan kredensial sekolah Anda</p>
        
        <div class="relative z-10">
          <input type="text" id="usernameInput" placeholder="Username" class="w-full px-4 py-3 rounded-lg bg-slate-700/50 border border-slate-600 focus:border-amber-400 focus:bg-slate-700 focus:outline-none mb-4 text-white placeholder-slate-400 transition">
          <input type="password" id="passwordInput" placeholder="Password" class="w-full px-4 py-3 rounded-lg bg-slate-700/50 border border-slate-600 focus:border-amber-400 focus:bg-slate-700 focus:outline-none mb-6 text-white placeholder-slate-400 transition">
          <button onclick="login()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 py-3 rounded-lg font-bold transition shadow-[0_0_15px_rgba(245,158,11,0.2)]">Masuk ke Instrumen</button>
        </div>
      </div>
    </div>

    <!-- Skeleton Loader -->
    <div id="skeletonLoader" class="absolute inset-0 z-30 bg-slate-900 flex flex-col sm:flex-row p-4 sm:p-6 gap-6 hidden">
      <div class="w-full sm:w-1/4 h-full bg-slate-800 rounded-xl p-4 animate-pulse shrink-0 border border-slate-700/50">
        <div class="h-6 bg-slate-700 rounded w-1/2 mb-8"></div>
        <div class="h-10 bg-slate-700 rounded mb-4"></div>
        <div class="h-10 bg-slate-700 rounded mb-4"></div>
      </div>
      <div class="w-full sm:w-3/4 h-full bg-slate-800 rounded-xl p-6 animate-pulse border border-slate-700/50">
        <div class="h-12 bg-slate-700 rounded w-1/3 mb-6"></div>
        <div class="h-32 bg-slate-700 rounded mb-8"></div>
        <div class="h-24 bg-slate-700 rounded mb-4"></div>
        <div class="h-24 bg-slate-700 rounded mb-4"></div>
      </div>
    </div>

    <!-- Dashboard & Form -->
    <div id="dashboardSection" class="w-full h-full flex flex-col sm:flex-row hidden">
      
      <!-- Sidebar Navigasi -->
      <aside class="w-full sm:w-1/4 bg-slate-800 border-r border-slate-700 flex flex-col shrink-0 sm:h-full h-48 shadow-xl z-10">
        <div class="p-5 border-b border-slate-700 bg-slate-800">
          <p class="text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-semibold">Sekolah Aktif</p>
          <h3 id="schoolName" class="font-bold text-base text-amber-400 leading-tight">Memuat Nama...</h3>
        </div>
        <nav class="flex-1 overflow-y-auto p-3 space-y-1" id="sidebarNav"></nav>
        <div class="p-4 border-t border-slate-700">
          <button onclick="location.reload()" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded text-sm font-semibold text-white transition">Keluar Sistem</button>
        </div>
      </aside>

      <!-- Main Form Content -->
      <section class="w-full sm:w-3/4 bg-slate-900 overflow-y-auto relative h-full">
        <!-- Overlay Selesai -->
        <div id="lockedOverlay" class="absolute inset-0 bg-slate-900/95 backdrop-blur-sm z-20 flex flex-col items-center justify-center hidden p-6 text-center">
          <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mb-6 text-4xl border border-emerald-500/30">✓</div>
          <h2 class="text-3xl font-bold text-white mb-3">Monev Selesai</h2>
          <p class="text-slate-400 mb-8 max-w-md">Data instrumen sekolah Anda telah difinalisasi, dikunci, dan dikirim ke Dinas Pendidikan.</p>
          <a id="btnDownloadPDF" href="#" target="_blank" class="px-8 py-3 bg-blue-600 hover:bg-blue-500 text-white rounded-lg font-bold shadow-lg shadow-blue-600/20 transition">Lihat / Unduh Berkas PDF</a>
        </div>

        <div class="max-w-5xl mx-auto p-6 sm:p-10 lg:p-12" id="formArea"></div>
      </section>
    </div>
  </main>

  <footer class="w-full bg-slate-950 text-center py-3 text-[10px] sm:text-xs font-medium tracking-wider text-slate-500 whitespace-nowrap border-t border-slate-800 z-10 shrink-0">
    DIGITALLY SHAPED BY
    <img src="https://i.ibb.co.com/KpqwmHd6/Logo-Jemprot-2-1-removebg-preview.png" alt="Logo JeMPROT" class="inline-block align-middle h-4 sm:h-5 mx-1 object-contain brightness-[4] contrast-150 saturate-150 drop-shadow-[0_0_8px_rgba(56,189,248,0.8)]">
    <span class="text-slate-400 font-bold ml-1">[BID SMP 2026]</span>
  </footer>

  <script>
    // URL API GAS TERBARU SESUAI PERMINTAAN
    const API_URL = 'https://script.google.com/macros/s/AKfycbwIlUR9iKVWGyRSGmEORCPODLE3zftJCBZRbCUftHqGFemr15CxAjD_nlCQO-0FOnuYqA/exec';
    
    let sessionData = {};
    let currentDraft = {};
    let activeBabIndex = 0;

    // --- DATA INSTRUMEN & RUBRIK ---
    const instrumenData = [
      {
        bab: "Indikator 1: Peran Dinas Pendidikan Kab/Kota",
        rubrik: {
          K: "Dinas Pendidikan tidak melakukan pembinaan, pemantauan, maupun fasilitasi koordinasi dalam program revitalisasi sekolah.",
          CB: "Dinas Pendidikan melakukan sosialisasi awal program revitalisasi, namun belum memberikan pembinaan dan fasilitasi koordinasi secara berkala.",
          B: "Dinas Pendidikan aktif memberikan pembinaan, memfasilitasi koordinasi antar- pihak, serta memantau progres pelaksanaan revitalisasi secara rutin.",
          SB: "Dinas Pendidikan memberikan pembinaan berkala, memfasilitasi koordinasi, memantau progres, serta memberikan solusi konkret/advokasi kebijakan atas kendala yang dihadapi sekolah"
        },
        soal: [
          "Apakah Dinas Pendidikan melakukan sosialisasi awal terkait program revitalisasi sekolah?",
          "Apakah Dinas Pendidikan memberikan pembinaan dan arahan teknis secara berkala selama program berjalan?",
          "Apakah Dinas Pendidikan memantau progres pelaksanaan fisik dan administrasi sekolah secara rutin?",
          "Apakah Dinas Pendidikan memberikan solusi konkret atau advokasi regulasi ketika sekolah menemui kendala prinsipil?"
        ]
      },
      {
        bab: "Indikator 2: Peran Kepala Sekolah",
        rubrik: {
          K: "Kepala Sekolah tidak membentuk tim pelaksana dan tidak terlibat dalam pengendalian program revitalisasi.",
          CB: "Kepala Sekolah membentuk tim pelaksana (P2SP) namun fungsi pengendalian dan pengawasan harian belum berjalan optimal.",
          B: "Kepala Sekolah memimpin koordinasi berkala dengan P2SP, perencana, dan pengawas serta mengendalikan kesesuaian mutu pekerjaan.",
          SB: "Kepala Sekolah mengendalikan seluruh tahapan program, aktif berkoordinasi, melakukan evaluasi berkala, dan memastikan akuntabilitas pelaporan pertanggungjawaban."
        },
        soal: [
          "Apakah Kepala Sekolah membentuk Tim P2SP melalui keputusan resmi?",
          "Apakah Kepala Sekolah memimpin rapat koordinasi rutin dengan seluruh unsur pelaksana?",
          "Apakah Kepala Sekolah melakukan kontrol langsung terhadap kesesuaian mutu hasil pembangunan di lapangan?",
          "Apakah Kepala Sekolah memastikan seluruh dokumen laporan pertanggungjawaban disusun secara akuntabel dan tepat waktu?"
        ]
      },
      {
        bab: "Indikator 3: Peran P2SP",
        rubrik: {
          K: "P2SP tidak melaksanakan tugas pembangunan sesuai petunjuk teknis dan administrasi tidak teratur.",
          CB: "P2SP melaksanakan pembangunan fisik dasar namun administrasi keuangan dan logistik belum terdokumentasi dengan rapi.",
          B: "P2SP melaksanakan pembangunan sesuai spesifikasi teknis serta mengelola administrasi, material, dan pekerja dengan baik.",
          SB: "P2SP mengelola seluruh proses pembangunan secara transparan, akuntabel, tepat mutu, tepat waktu, dan mendokumentasikan setiap tahapan secara sistematis."
        },
        soal: [
          "Apakah P2SP melaksanakan pengadaan bahan dan pekerja sesuai dengan ketentuan petunjuk teknis?",
          "Apakah P2SP melakukan pencatatan administrasi keuangan dan material masuk/keluar secara rutin?",
          "Apakah P2SP memastikan hasil pekerjaan fisik harian sesuai dengan spesifikasi yang ditetapkan?",
          "Apakah P2SP mendokumentasikan perkembangan fisik (foto 0%, 50%, 100%) dan administrasi secara lengkap dan sistematis?"
        ]
      },
      {
        bab: "Indikator 4: Peran Perencana",
        rubrik: {
          K: "Perencana tidak menyediakan dokumen desain (DED) dan Rencana Anggaran Biaya (RAB) yang memadai untuk pelaksanaan lapangan.",
          CB: "Perencana menyediakan dokumen desain dan RAB awal, namun sulit diimplementasikan atau banyak ketidaksesuaian dengan kondisi riil sekolah.",
          B: "Perencana menyediakan dokumen teknis yang akurat (gambar kerja, RAB, RKS) dan bersedia memberikan klarifikasi jika diperlukan oleh pelaksana.",
          SB: "Perencana menghasilkan dokumen perencanaan yang detail, akurat, sesuai kebutuhan sekolah, serta aktif mendampingi proses rekayasa lapangan (justifikasi teknis) apabila ada perubahan."
        },
        soal: [
          "Apakah Perencana menyusun dokumen Gambar Detail Desain (DED) dan RAB sebelum pembangunan dimulai?",
          "Apakah dokumen perencanaan yang dibuat mudah dipahami dan diterapkan oleh tim pelaksana di lapangan?",
          "Apakah Perencana memberikan penjelasan teknis (aanwijzing) atau klarifikasi terhadap keraguan pelaksana lapangan?",
          "Apakah Perencana memberikan rekomendasi penyesuaian desain/justifikasi teknis secara cepat jika terjadi perbedaan kondisi riil lapangan?"
        ]
      },
      {
        bab: "Indikator 5: Peran Pengawas (Pengawas Konstruksi)",
        rubrik: {
          K: "Pengawas tidak melakukan supervisi lapangan dan tidak membuat laporan pengawasan berkala.",
          CB: "Pengawas melakukan kunjungan lapangan sesekali, namun laporan pengawasan dan catatan koreksi tidak terdokumentasi dengan jelas.",
          B: "Pengawas melakukan supervisi rutin, mengontrol kualitas bahan/pekerjaan, serta memberikan rekomendasi perbaikan secara tertulis.",
          SB: "Pengawas melakukan pengawasan ketat secara berkala, menerbitkan laporan mingguan/bulanan, memastikan kepatuhan terhadap Kurva S, serta menjamin mutu hasil akhir konstruksi."
        },
        soal: [
          "Apakah Pengawas melakukan kunjungan dan verifikasi fisik secara terjadwal di lapangan?",
          "Apakah Pengawas memeriksa dan memastikan kualitas bahan bangunan yang masuk sesuai dengan spesifikasi?",
          "Apakah Pengawas memberikan instruksi atau catatan koreksi tertulis jika ditemukan deviasi pekerjaan?",
          "Apakah Pengawas menyusun laporan pengawasan berkala yang mengukur kesesuaian progres riil dengan rencana?"
        ]
      },
      {
        bab: "Indikator 6: Progres Pembangunan dengan Kurva S",
        rubrik: {
          K: "Sekolah tidak memiliki dokumen Kurva S dan tidak mengukur progres capaian fisik mingguan.",
          CB: "Sekolah memiliki Kurva S, namun pembaruan (updating) realisasi progres tidak dilakukan secara berkala sehingga grafik tidak mencerminkan kondisi riil.",
          B: "Progres fisik dihitung setiap minggu dan diplot pada Kurva S untuk melihat adanya deviasi (plus/minus) antara rencana dan realisasi.",
          SB: "Kurva S diperbarui secara disiplin tiap minggu, digunakan sebagai alat kendali utama, dan jika terjadi critical delay (deviasi minus signifikan) langsung diikuti dengan rencana aksi percepatan (catch-up plan)."
        },
        soal: [
          "Apakah sekolah memiliki dokumen Kurva S yang disetujui sebagai acuan jadwal pelaksanaan pekerjaan?",
          "Apakah perhitungan bobot persentase capaian fisik diperbarui secara berkala pada grafik Kurva S?",
          "Apakah grafik Kurva S menunjukkan kesesuaian (atau deviasi yang masih aman) antara rencana kumulatif dengan realisasi di lapangan?",
          "Apakah hasil analisis Kurva S digunakan sebagai dasar penentuan strategi percepatan pekerjaan jika terjadi keterlambatan?",
          "Apakah dokumen pembaruan Kurva S ini dilaporkan secara berkala kepada pihak manajemen dan dinas terkait?"
        ]
      },
      {
        bab: "Indikator 7: Hambatan yang Muncul dan Penanganannya",
        rubrik: {
          K: "Sekolah mengabaikan hambatan yang muncul (faktor cuaca, pasokan bahan, pekerja, dana) sehingga menyebabkan proyek mangkrak.",
          CB: "Sekolah mengidentifikasi adanya hambatan yang mengganggu jalannya proyek, namun belum memiliki tindakan penyelesaian yang terarah.",
          B: "Sekolah mendata setiap hambatan teknis maupun non-teknis serta mendiskusikannya dengan para pihak untuk mencari solusi lokal.",
          SB: "Sekolah mengelola risiko hambatan secara proaktif, memiliki buku catatan kendala (issue log), menerapkan langkah mitigasi yang cepat, dan berhasil memulihkan progres pembangunan tanpa mengurangi mutu."
        },
        soal: [
          "Apakah sekolah memetakan dan mencatat hambatan (seperti keterlambatan material, kendala cuaca, atau masalah tukang) yang muncul selama pembangunan?",
          "Apakah setiap hambatan yang muncul langsung dicarikan solusi jangka pendek agar pekerjaan tidak terhenti total?",
          "Apakah sekolah melibatkan unsur eksternal (Perencana/Pengawas/Dinas) untuk memecahkan hambatan yang memerlukan keputusan teknis khusus?",
          "Apakah sekolah melakukan evaluasi terhadap efektivitas solusi atau mitigasi yang telah diterapkan pada hambatan sebelumnya?",
          "Apakah hambatan dan langkah penanganannya didokumentasikan dalam laporan berkala sebagai bagian dari akuntabilitas proyek?"
        ]
      }
    ];

    async function reqGAS(data) {
      try {
        const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(data) });
        return await res.json();
      } catch (err) {
        return { status: 'error', message: 'Koneksi gagal. Pastikan URL GAS benar dan di-set "Anyone".' };
      }
    }

    function showSkeleton(show) {
      document.getElementById('skeletonLoader').classList.toggle('hidden', !show);
    }

    async function login() {
      const u = document.getElementById('usernameInput').value.trim();
      const p = document.getElementById('passwordInput').value.trim();
      
      if (!u || !p) return Swal.fire('Oops', 'Lengkapi Username dan Password', 'warning');

      document.getElementById('loginSection').classList.add('hidden');
      showSkeleton(true);

      const res = await reqGAS({ action: 'loginSekolah', username: u, npsn: p });
      showSkeleton(false);

      if (res.status === 'success') {
        sessionData = res.data;
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('schoolName').innerText = sessionData.nama_sekolah;
        
        if (sessionData.pdf_link) {
          document.getElementById('lockedOverlay').classList.remove('hidden');
          document.getElementById('btnDownloadPDF').href = sessionData.pdf_link;
        } else {
          try { currentDraft = JSON.parse(sessionData.draft_json); } catch(e) { currentDraft = {}; }
          buildUI();
        }
      } else {
        document.getElementById('loginSection').classList.remove('hidden');
        Swal.fire('Akses Ditolak', res.message, 'error');
      }
    }

    function buildUI() {
      let sidebarHTML = '';
      instrumenData.forEach((bab, i) => {
        sidebarHTML += `<div id="navBab-${i}" onclick="switchBab(${i})" class="p-3 rounded-lg cursor-pointer text-sm font-semibold transition ${i === 0 ? 'bg-amber-500/20 text-amber-400 border-l-4 border-amber-500' : 'text-slate-400 hover:bg-slate-700/50 hover:text-slate-300'}">${bab.bab.split(':')[0]}</div>`;
      });
      document.getElementById('sidebarNav').innerHTML = sidebarHTML;
      renderBab(0);
    }

    function switchBab(index) {
      document.getElementById(`navBab-${activeBabIndex}`).className = "p-3 rounded-lg cursor-pointer text-sm font-semibold transition text-slate-400 hover:bg-slate-700/50 hover:text-slate-300";
      document.getElementById(`navBab-${index}`).className = "p-3 rounded-lg cursor-pointer text-sm font-semibold transition bg-amber-500/20 text-amber-400 border-l-4 border-amber-500";
      activeBabIndex = index;
      renderBab(index);
    }

    function renderBab(index) {
      const babData = instrumenData[index];
      let startingNumber = 1;
      for (let i = 0; i < index; i++) startingNumber += instrumenData[i].soal.length;

      let formHTML = `
        <div class="fade-in">
          <h2 class="text-2xl font-bold text-white mb-6 leading-tight border-b border-slate-700 pb-4">${babData.bab}</h2>
          
          <div class="mb-10 bg-slate-800/80 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
            <div class="bg-slate-800 px-5 py-3 border-b border-slate-700 flex items-center gap-2">
              <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              <h3 class="font-bold text-slate-200 text-sm tracking-wide">PANDUAN PENILAIAN INSTRUMEN</h3>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 divide-y md:divide-y-0 md:divide-x divide-slate-700">
              <div class="p-5 relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-rose-500/80"></div>
                <h4 class="font-bold text-rose-400 mb-2">KURANG (K)</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${babData.rubrik.K}</p>
              </div>
              <div class="p-5 relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-amber-500/80"></div>
                <h4 class="font-bold text-amber-400 mb-2">CUKUP BAIK (CB)</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${babData.rubrik.CB}</p>
              </div>
              <div class="p-5 relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-blue-500/80"></div>
                <h4 class="font-bold text-blue-400 mb-2">BAIK (B)</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${babData.rubrik.B}</p>
              </div>
              <div class="p-5 relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-emerald-500/80"></div>
                <h4 class="font-bold text-emerald-400 mb-2">SANGAT BAIK (SB)</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${babData.rubrik.SB}</p>
              </div>
            </div>
          </div>

          <div class="space-y-6">`;

      babData.soal.forEach((soal, i) => {
        let qNum = startingNumber + i;
        let draftVal = currentDraft[`q${qNum}`] || '';
        
        formHTML += `
          <div class="bg-slate-800/40 p-6 rounded-xl border border-slate-700/50 hover:border-slate-600 transition">
            <label class="block mb-5 font-medium text-slate-200 leading-relaxed"><span class="text-amber-400 font-bold mr-2">${qNum}.</span> ${soal}</label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              ${['K', 'CB', 'B', 'SB'].map(opt => `
                <label class="relative cursor-pointer">
                  <input type="radio" name="q${qNum}" value="${opt}" onchange="autoSave('q${qNum}', '${opt}')" ${draftVal === opt ? 'checked' : ''} class="peer sr-only">
                  <div class="px-3 py-3 text-center rounded-lg border border-slate-700 bg-slate-800/80 text-slate-400 text-sm font-bold transition peer-checked:bg-blue-600/20 peer-checked:border-blue-500 peer-checked:text-blue-400 hover:bg-slate-700">
                    ${opt}
                  </div>
                </label>
              `).join('')}
            </div>
          </div>
        `;
      });

      formHTML += `</div><div class="flex justify-between items-center mt-10 pt-6 border-t border-slate-800">`;
      
      if (index > 0) {
        formHTML += `<button onclick="switchBab(${index - 1})" class="px-6 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition font-medium">← Bab Sebelumnya</button>`;
      } else {
        formHTML += `<div></div>`;
      }

      if (index < instrumenData.length - 1) {
        formHTML += `<button onclick="switchBab(${index + 1})" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold transition">Selanjutnya →</button>`;
      } else {

    }

    async function generatePDF() {
      if (Object.keys(currentDraft).length < 30) {
        return Swal.fire('Belum Lengkap', 'Harap jawab seluruh 30 pertanyaan sebelum melakukan finalisasi.', 'warning');
      }

      Swal.fire({ title: 'Menyusun Dokumen...', text: 'Menginjeksi Template PDF & Menyimpan ke Drive', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      try {
        // 1. Memanggil PDFLib beserta StandardFonts
        const { PDFDocument, rgb, StandardFonts } = PDFLib;
        
        const urlTemplate = 'https://dikbudkra.github.io/inst-revitsmp/INSTRUMEN_revit_2026.pdf';
        const existingPdfBytes = await fetch(urlTemplate).then(res => res.arrayBuffer());
        const pdfDoc = await PDFDocument.load(existingPdfBytes);
        const pages = pdfDoc.getPages();
        
        // 2. Memuat Font khusus simbol (ZapfDingbats)
        const checkFont = await pdfDoc.embedFont(StandardFonts.ZapfDingbats);
        
        // 3. Halaman Depan (Nama Sekolah)
        const page1 = pages[0];
        page1.drawText('MONEV INSTRUMEN REVITALISASI', { x: 50, y: 350, size: 20, color: rgb(0.1, 0.1, 0.1) });
        page1.drawText(sessionData.nama_sekolah, { x: 50, y: 320, size: 24, color: rgb(0, 0.2, 0.6) });
        
        // 4. Looping Centang (Menggunakan Font ZapfDingbats)
        for (let i = 1; i <= 30; i++) {
          let jwb = currentDraft[`q${i}`]; 
          let coordData = coordMap[`q${i}`];
          
          if(coordData && coordData[jwb]) {
            let targetPage = pages[coordData.p];
            let xPos = coordData[jwb][0];
            let yPos = coordData[jwb][1];
            
            // Gunakan simbol unicode aslinya, bukan angka 4
            targetPage.drawText('✔', { 
              x: xPos, 
              y: yPos, 
              size: 14, 
              font: checkFont, 
              color: rgb(0.1, 0.2, 0.4) 
            }); 
          }
        }
        
        const pdfBytes = await pdfDoc.saveAsBase64({ dataUri: true });
        
        // 5. Kirim ke GAS Backend
        const res = await reqGAS({ action: 'finalize', npsn: sessionData.npsn, pdfBase64: pdfBytes, namaSekolah: sessionData.nama_sekolah });
        
        if (res.status === 'success') {
          Swal.close();
          document.getElementById('formArea').classList.add('hidden'); 
          document.getElementById('lockedOverlay').classList.remove('hidden');
          document.getElementById('btnDownloadPDF').href = res.pdf_link;
        } else {
          Swal.fire('Error', res.message, 'error');
        }
      } catch (err) {
        console.error(err);
        // Menampilkan pesan error spesifik jika terjadi kegagalan
        Swal.fire('Error PDF', 'Gagal memproses PDF: ' + err.message, 'error');
      }
    }
