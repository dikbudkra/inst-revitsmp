    // --- PARSER PINTAR UNTUK MEMBACA "instrumen iksan.txt" OTOMATIS ---
    function parseInstrumenTxt(text) {
      if (!text || typeof text !== 'string') return null;
      const blocks = [];
      const babRegex = /bab\s*:\s*["']([^"']+)["']/g;
      const matches = [...text.matchAll(babRegex)];
      for (let i = 0; i < matches.length; i++) {
        const start = matches[i].index;
        const end = i + 1 < matches.length ? matches[i + 1].index : text.length;
        const chunk = text.slice(start, end);
        const bab = matches[i][1].trim();
        const getRubrik = (key) => {
          const m = chunk.match(new RegExp(key + "\\s*:\\s*[\"']([^\"']+)[\"']"));
          return m ? m[1].trim() : "";
        };
        const soalMatch = chunk.match(/soal\s*:\s*\[([\s\S]*?)\]/);
        const soal = [];
        if (soalMatch) {
          const qMatches = [...soalMatch[1].matchAll(/["']([^"']+)["']/g)];
          for (const qm of qMatches) {
            let q = qm[1].trim();
            if (q.length > 0) {
              q = q.charAt(0).toUpperCase() + q.slice(1);
              soal.push(q);
            }
          }
        }
        if (bab && soal.length > 0) {
          blocks.push({
            bab,
            rubrik: {
              K: getRubrik("K"),
              CB: getRubrik("CB"),
              B: getRubrik("B"),
              SB: getRubrik("SB")
            },
            soal
          });
        }
      }
      return blocks.length > 0 ? blocks : null;
    }

    async function loadExternalInstrumen() {
      const urls = [
        `./instrumen%20iksan.txt?t=${Date.now()}`,
        `https://raw.githubusercontent.com/dikbudkra/inst-revitsmp/main/instrumen%20iksan.txt?t=${Date.now()}`
      ];
      for (const url of urls) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (res.ok) {
            const txt = await res.text();
            const parsed = parseInstrumenTxt(txt);
            if (parsed && parsed.length > 0) {
              instrumenData.length = 0;
              parsed.forEach(item => instrumenData.push(item));
              if (sessionData && sessionData.npsn && !sessionData.pdf_link) {
                buildUI();
              }
              return;
            }
          }
        } catch (e) {
          // Gunakan fallback bawaan jika gagal memuat file eksternal
        }
      }
    }
    loadExternalInstrumen();

    function getTotalQuestions() {
      return instrumenData.reduce((acc, bab) => acc + bab.soal.length, 0);

    async function reqGAS(data) {
      try {
        const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(data) });
        return await res.json();
      } catch (err) {
        return { status: 'error', message: 'Koneksi gagal. Pastikan URL GAS benar dan di-set "Anyone".' };
      }
    }

    function showSkeleton(show) {
      document.getElementById('skeletonLoader').classList.toggle('hidden', !show);
    }

    async function login() {
      const u = document.getElementById('usernameInput').value.trim();
      const p = document.getElementById('passwordInput').value.trim();
      
      if (!u || !p) return Swal.fire('Oops', 'Lengkapi Username dan Password', 'warning');

      document.getElementById('loginSection').classList.add('hidden');
      showSkeleton(true);

      const res = await reqGAS({ action: 'loginSekolah', username: u, npsn: p });
      showSkeleton(false);

      if (res.status === 'success') {
        sessionData = res.data;
        document.getElementById('dashboardSection').classList.remove('hidden');
        document.getElementById('schoolName').innerText = sessionData.nama_sekolah;
        
        if (sessionData.pdf_link) {
          document.getElementById('lockedOverlay').classList.remove('hidden');
          document.getElementById('btnDownloadPDF').href = sessionData.pdf_link;
        } else {
          try { currentDraft = JSON.parse(sessionData.draft_json); } catch(e) { currentDraft = {}; }
          buildUI();
        }
      } else {
        document.getElementById('loginSection').classList.remove('hidden');
        Swal.fire('Akses Ditolak', res.message, 'error');
      }
    }

    function buildUI() {

      });
      document.getElementById('sidebarNav').innerHTML = sidebarHTML;
      renderBab(0);
    }

    function switchBab(index) {
      document.getElementById(`navBab-${activeBabIndex}`).className = "p-3 rounded-lg cursor-pointer text-sm font-semibold transition text-slate-400 hover:bg-slate-700/50 hover:text-slate-300";
      document.getElementById(`navBab-${index}`).className = "p-3 rounded-lg cursor-pointer text-sm font-semibold transition bg-amber-500/20 text-amber-400 border-l-4 border-amber-500";
      activeBabIndex = index;
      renderBab(index);
    }

      const babData = instrumenData[index];
      let startingNumber = 1;
      for (let i = 0; i < index; i++) startingNumber += instrumenData[i].soal.length;

      let formHTML = `
        <div class="fade-in">
          <h2 class="text-2xl font-bold text-white mb-6 leading-tight border-b border-slate-700 pb-4">${babData.bab}</h2>
          
          <div class="mb-10 bg-slate-800/80 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
            <div class="bg-slate-800 px-5 py-3 border-b border-slate-700 flex items-center gap-2">
              <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
              <h3 class="font-bold text-slate-200 text-sm tracking-wide">PANDUAN PENILAIAN INSTRUMEN</h3>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 divide-y md:divide-y-0 md:divide-x divide-slate-700">
              <div class="p-5 relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-rose-500/80"></div>
                <h4 class="font-bold text-rose-400 mb-2">KURANG (K)</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${babData.rubrik.K}</p>
              </div>
              <div class="p-5 relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-amber-500/80"></div>
                <h4 class="font-bold text-amber-400 mb-2">CUKUP BAIK (CB)</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${babData.rubrik.CB}</p>
              </div>
              <div class="p-5 relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-blue-500/80"></div>
                <h4 class="font-bold text-blue-400 mb-2">BAIK (B)</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${babData.rubrik.B}</p>
              </div>
              <div class="p-5 relative">
                <div class="absolute top-0 left-0 w-full h-1 bg-emerald-500/80"></div>
                <h4 class="font-bold text-emerald-400 mb-2">SANGAT BAIK (SB)</h4>
                <p class="text-xs text-slate-300 leading-relaxed">${babData.rubrik.SB}</p>
              </div>
            </div>
          </div>

          <div class="space-y-6">`;

      babData.soal.forEach((soal, i) => {
        let qNum = startingNumber + i;
        let draftVal = currentDraft[`q${qNum}`] || '';
        
        formHTML += `
          <div class="bg-slate-800/40 p-6 rounded-xl border border-slate-700/50 hover:border-slate-600 transition">
            <label class="block mb-5 font-medium text-slate-200 leading-relaxed"><span class="text-amber-400 font-bold mr-2">${qNum}.</span> ${soal}</label>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
              ${['K', 'CB', 'B', 'SB'].map(opt => `
                <label class="relative cursor-pointer">
                  <input type="radio" name="q${qNum}" value="${opt}" onchange="autoSave('q${qNum}', '${opt}')" ${draftVal === opt ? 'checked' : ''} class="peer sr-only">
                  <div class="px-3 py-3 text-center rounded-lg border border-slate-700 bg-slate-800/80 text-slate-400 text-sm font-bold transition peer-checked:bg-blue-600/20 peer-checked:border-blue-500 peer-checked:text-blue-400 hover:bg-slate-700">
                    ${opt}
                  </div>
                </label>
              `).join('')}
            </div>
          </div>
        `;
      });

      formHTML += `</div><div class="flex justify-between items-center mt-10 pt-6 border-t border-slate-800">`;
      
      if (index > 0) {
        formHTML += `<button onclick="switchBab(${index - 1})" class="px-6 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-700 transition font-medium">← Bab Sebelumnya</button>`;
      } else {
        formHTML += `<div></div>`;
      }

      if (index < instrumenData.length - 1) {
        formHTML += `<button onclick="switchBab(${index + 1})" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg font-bold transition">Selanjutnya →</button>`;
      } else {
        formHTML += `<button onclick="generatePDF()" class="px-8 py-3 bg-amber-500 hover:bg-amber-400 text-slate-900 rounded-lg font-bold shadow-lg shadow-amber-500/20 transition transform hover:-translate-y-1">Finalisasi & Kirim</button>`;
      }

      formHTML += `</div></div>`;
      
      const formArea = document.getElementById('formArea');
      formArea.innerHTML = formHTML;
      document.querySelector('section').scrollTo({top: 0, behavior: 'smooth'});
    }

    async function autoSave(questionId, value) {
      currentDraft[questionId] = value;
      reqGAS({ action: 'saveDraft', npsn: sessionData.npsn, draftJson: JSON.stringify(currentDraft) });
    }

    // FUNGSI HELPER UNTUK MENGUBAH BASE64 KE ARRAYBUFFER
    function base64ToArrayBuffer(base64) {
      const binary_string = window.atob(base64);
      const len = binary_string.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) { bytes[i] = binary_string.charCodeAt(i); }
      return bytes.buffer;
    }

    function sanitizePdfText(str) {
      if (!str) return '';
      return String(str)
        .replace(/[\u2018\u2019\u0060\u00B4]/g, "'")
        .replace(/[\u201C\u201D]/g, '"')
        .replace(/[\u2013\u2014]/g, '-')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function wrapPdfText(text, font, fontSize, maxWidth) {
      const clean = sanitizePdfText(text);
      if (!clean) return [''];
      const words = clean.split(' ');
      const lines = [];
      let currentLine = '';
      for (const word of words) {
        const testLine = currentLine ? `${currentLine} ${word}` : word;
        if (font.widthOfTextAtSize(testLine, fontSize) <= maxWidth) {
          currentLine = testLine;
        } else {
          if (currentLine) lines.push(currentLine);
          currentLine = word;
        }
      }
      if (currentLine) lines.push(currentLine);
      return lines.length > 0 ? lines : [''];
    }

    function drawCornerOrnaments(page, W, H, rgb) {
      // Ornamen Lengkungan Sudut Kanan Atas
      page.drawEllipse({ x: W + 35, y: H + 35, xScale: 154, yScale: 154, color: rgb(0.75, 0.84, 0.93) });
      page.drawEllipse({ x: W + 35, y: H + 35, xScale: 149, yScale: 149, color: rgb(1, 1, 1) });
      page.drawEllipse({ x: W + 35, y: H + 35, xScale: 144, yScale: 144, color: rgb(0.02, 0.16, 0.31) });

      // Ornamen Lengkungan Sudut Kiri Bawah
      page.drawEllipse({ x: -35, y: -35, xScale: 134, yScale: 134, color: rgb(0.75, 0.84, 0.93) });
      page.drawEllipse({ x: -35, y: -35, xScale: 129, yScale: 129, color: rgb(1, 1, 1) });
      page.drawEllipse({ x: -35, y: -35, xScale: 124, yScale: 124, color: rgb(0.02, 0.16, 0.31) });
    }

    function renderIndicatorToPdf(mergedPdf, babData, babIdx, startingQNum, fonts, rgb) {
      const W = 595.28;
      const H = 841.89;
      const { fontRegular, fontBold, fontTitle, checkFont } = fonts;

      const colorHeaderBg = rgb(0.992, 0.902, 0.769); // #FDE6C4
      const colorRowBg = rgb(1, 0.994, 0.984);        // #FFFEFA
      const colorBorder = rgb(0.957, 0.796, 0.655);   // #F4CBA7
      const colorText = rgb(0.06, 0.06, 0.06);
      const colorCheck = rgb(0.08, 0.20, 0.42);

      let page = mergedPdf.addPage([W, H]);
      drawCornerOrnaments(page, W, H, rgb);

      // Judul Utama pada Halaman Indikator Pertama
      let cursorY = 768;
      if (babIdx === 0) {
        const mainTitle = 'INSTRUMEN MONEV';
        const titleW = fontTitle.widthOfTextAtSize(mainTitle, 21);
        page.drawText(mainTitle, {
          x: (W - titleW) / 2,
          y: 785,
          size: 21,
          font: fontTitle,
          color: colorText
        });
        cursorY = 748;
      }

      // Judul Indikator
      const babLabel = sanitizePdfText(babData.bab).replace(/^indikator\s*(\d+)\s*:/i, 'INDIKATOR $1:');
      page.drawText(babLabel, {
        x: 36,
        y: cursorY,
        size: 12,
        font: fontBold,
        color: colorText
      });

      // Konfigurasi Tabel Pernyataan
      const tableX = 14;
      const colWidths = [37, 370, 40, 40, 40, 40]; // Total = 567
      const colX = [14, 51, 421, 461, 501, 541];
      const headers = ['NO', 'PERNYATAAN', 'K', 'CB', 'B', 'SB'];

      // Ukuran dinamis menyesuaikan jumlah soal dalam indikator
      const soalCount = babData.soal.length;
      const qFontSize = soalCount > 5 ? 9.0 : (soalCount > 4 ? 9.4 : 10);
      const qLineHeight = qFontSize * 1.35;
      const minRowH = soalCount > 5 ? 40 : (soalCount > 4 ? 48 : 56);
      const rowPadY = soalCount > 5 ? 14 : 18;

      let tableTopY = cursorY - 16;
      const headerH = 34;

      function drawStatementHeader(targetPage, topY) {
        for (let c = 0; c < 6; c++) {
          targetPage.drawRectangle({
            x: colX[c],
            y: topY - headerH,
            width: colWidths[c],
            height: headerH,
            color: colorHeaderBg,
            borderColor: colorBorder,
            borderWidth: 1.1
          });
          const hText = headers[c];
          const hW = fontBold.widthOfTextAtSize(hText, 9.5);
          targetPage.drawText(hText, {
            x: colX[c] + (colWidths[c] - hW) / 2,
            y: topY - headerH / 2 - 3.5,
            size: 9.5,
            font: fontBold,
            color: colorText
          });
        }
      }

      drawStatementHeader(page, tableTopY);
      let curY = tableTopY - headerH;
      const optIndexMap = { K: 2, CB: 3, B: 4, SB: 5 };

      // Gambar Baris Soal (dengan dukungan pindah halaman otomatis bila soal sangat banyak)
      babData.soal.forEach((soalText, idx) => {
        const qNum = startingQNum + idx;
        const wrappedLines = wrapPdfText(soalText, fontRegular, qFontSize, colWidths[1] - 20);
        const textBlockH = wrappedLines.length * qLineHeight;
        const rowH = Math.max(minRowH, textBlockH + rowPadY);

        if (curY - rowH < 65) {
          page = mergedPdf.addPage([W, H]);
          drawCornerOrnaments(page, W, H, rgb);
          drawStatementHeader(page, 765);
          curY = 765 - headerH;
        }

        for (let c = 0; c < 6; c++) {
          page.drawRectangle({
            x: colX[c],
            y: curY - rowH,
            width: colWidths[c],
            height: rowH,
            color: colorRowBg,
            borderColor: colorBorder,
            borderWidth: 1.1
          });
        }

        // Nomor Soal
        const numStr = String(qNum);
        const numW = fontRegular.widthOfTextAtSize(numStr, qFontSize);
        page.drawText(numStr, {
          x: colX[0] + (colWidths[0] - numW) / 2,
          y: curY - rowH / 2 - qFontSize / 3,
          size: qFontSize,
          font: fontRegular,
          color: colorText
        });

        // Teks Pernyataan
        let lineY = curY - (rowH - textBlockH) / 2 - qFontSize + 1.5;
        wrappedLines.forEach(line => {
          page.drawText(line, {
            x: colX[1] + 10,
            y: lineY,
            size: qFontSize,
            font: fontRegular,
            color: colorText
          });
          lineY -= qLineHeight;
        });

        // Injeksi Tanda Centang (✔) Sesuai Jawaban
        const jwb = currentDraft[`q${qNum}`];
        const targetCol = optIndexMap[jwb];
        if (targetCol !== undefined) {
          const checkSize = 14;
          const checkW = checkFont.widthOfTextAtSize('✔', checkSize);
          page.drawText('✔', {
            x: colX[targetCol] + (colWidths[targetCol] - checkW) / 2,
            y: curY - rowH / 2 - checkSize / 3,
            size: checkSize,
            font: checkFont,
            color: colorCheck
          });
        }

        curY -= rowH;
      });

      // --- TABEL 2: RUBRIK PENILAIAN ---
      const shortBabName = sanitizePdfText(babData.bab).replace(/^Indikator\s*\d+\s*:\s*/i, '');
      const rubricTitle = `Tabel 1: Identifikasi unsur pembeda rubrik indikator ${shortBabName}`;
      const rTitleSize = 10;
      const rTitleW = fontBold.widthOfTextAtSize(rubricTitle, rTitleSize);

      const rHeaderH = 32;
      const rColW = 567 / 4;
      const rHeaders = ['KURANG', 'CUKUP BAIK', 'BAIK', 'SANGAT BAIK'];
      const rKeys = ['K', 'CB', 'B', 'SB'];
      const rFontSize = 9.0;
      const rLineH = 12.2;
      const wrappedRubriks = rKeys.map(k =>
        wrapPdfText((babData.rubrik && babData.rubrik[k]) || '-', fontRegular, rFontSize, rColW - 18)
      );
      const maxRubrikLines = Math.max(...wrappedRubriks.map(lines => lines.length), 1);
      const neededRubrikH = Math.max(145, maxRubrikLines * rLineH + 26);

      // Jika sisa ruang di bawah tidak cukup untuk tabel rubrik, buat halaman lanjutan
      if (curY - 40 - rHeaderH - neededRubrikH < 40) {
        page = mergedPdf.addPage([W, H]);
        drawCornerOrnaments(page, W, H, rgb);
        curY = 785;
      }

      let rTitleY = curY - 26;
      page.drawText(rubricTitle, {
        x: Math.max(14, (W - rTitleW) / 2),
        y: rTitleY,
        size: rTitleSize,
        font: fontBold,
        color: colorText
      });

      const rTableTopY = rTitleY - 12;

      for (let c = 0; c < 4; c++) {
        const rx = tableX + c * rColW;
        page.drawRectangle({
          x: rx,
          y: rTableTopY - rHeaderH,
          width: rColW,
          height: rHeaderH,
          color: colorHeaderBg,
          borderColor: colorBorder,
          borderWidth: 1.1
        });
        const rhText = rHeaders[c];
        const rhW = fontBold.widthOfTextAtSize(rhText, 9.2);
        page.drawText(rhText, {
          x: rx + (rColW - rhW) / 2,
          y: rTableTopY - rHeaderH / 2 - 3.2,
          size: 9.2,
          font: fontBold,
          color: colorText
        });
      }

      const rBodyTopY = rTableTopY - rHeaderH;
      const availableBottomH = Math.max(100, rBodyTopY - 45);
      const rBodyH = Math.min(availableBottomH, neededRubrikH);

      for (let c = 0; c < 4; c++) {
        const rx = tableX + c * rColW;
        page.drawRectangle({
          x: rx,
          y: rBodyTopY - rBodyH,
          width: rColW,
          height: rBodyH,
          color: colorRowBg,
          borderColor: colorBorder,
          borderWidth: 1.1
        });

        const lines = wrappedRubriks[c];
        const blockH = lines.length * rLineH;
        let ry = rBodyTopY - Math.max(12, (rBodyH - blockH) / 2) - rFontSize + 1.5;
        lines.forEach(line => {
          if (ry > rBodyTopY - rBodyH + 6) {
            page.drawText(line, {
              x: rx + 9,
              y: ry,
              size: rFontSize,
              font: fontRegular,
              color: colorText
            });
          }
          ry -= rLineH;
        });
      }
    }

    async function generatePDF() {
      const totalSoal = getTotalQuestions();
      const missingNums = [];
      for (let i = 1; i <= totalSoal; i++) {
        if (!currentDraft[`q${i}`]) missingNums.push(i);
      }

      if (missingNums.length > 0) {
        return Swal.fire(
          'Belum Lengkap',
          `Harap jawab seluruh ${totalSoal} pertanyaan sebelum melakukan finalisasi. (Nomor belum dijawab: ${missingNums.join(', ')})`,
          'warning'
        );
      }

      Swal.fire({ title: 'Merakit Dokumen...', html: '<b>Langkah 1/2:</b> Mengambil Cover Slide...<br><span class="text-xs text-slate-500">(Proses ini butuh waktu beberapa detik)</span>', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      try {
        const { PDFDocument, rgb, StandardFonts } = PDFLib;
        
        // LANGKAH 1: Minta GAS memproses Template Slide jadi PDF (Base64)
        const coverRes = await reqGAS({ action: 'generateCover', namaSekolah: sessionData.nama_sekolah });
        if(coverRes.status !== 'success') throw new Error(coverRes.message);
        
        Swal.update({ html: '<b>Langkah 2/2:</b> Menyusun Tabel Instrumen & Jawaban Otomatis...' });
        
        // LANGKAH 2: Buat Dokumen PDF & Salin Halaman 1 (Cover)
        const coverPdfBytes = base64ToArrayBuffer(coverRes.coverBase64);
        const coverDoc = await PDFDocument.load(coverPdfBytes);
        const mergedPdf = await PDFDocument.create();
        
        const copiedCoverPages = await mergedPdf.copyPages(coverDoc, [0]);
        mergedPdf.addPage(copiedCoverPages[0]);
        
        // LANGKAH 3: Render Seluruh Halaman Indikator Secara Dinamis dari instrumenData
        const fonts = {
          fontRegular: await mergedPdf.embedFont(StandardFonts.Helvetica),
          fontBold: await mergedPdf.embedFont(StandardFonts.HelveticaBold),
          fontTitle: await mergedPdf.embedFont(StandardFonts.TimesRomanBold),
          checkFont: await mergedPdf.embedFont(StandardFonts.ZapfDingbats)
        };

        let runningQNum = 1;
        instrumenData.forEach((babData, babIdx) => {
          renderIndicatorToPdf(mergedPdf, babData, babIdx, runningQNum, fonts, rgb);
          runningQNum += babData.soal.length;
        });
        
        // LANGKAH 4: Simpan dan Kirim ke Drive (via GAS)
        Swal.update({ html: 'Menyimpan final dokumen ke server...' });
        const pdfBase64DataUri = await mergedPdf.saveAsBase64({ dataUri: true });
        const cleanBase64 = pdfBase64DataUri.split(',')[1]; 
        
        const res = await reqGAS({ action: 'finalize', npsn: sessionData.npsn, pdfBase64: cleanBase64, namaSekolah: sessionData.nama_sekolah });
        
        if (res.status === 'success') {
          Swal.close();
          document.getElementById('formArea').classList.add('hidden'); 
          document.getElementById('lockedOverlay').classList.remove('hidden');
          document.getElementById('btnDownloadPDF').href = res.pdf_link;
        } else {
          Swal.fire('Error Penyimpanan', res.message, 'error');
        }
      } catch (err) {
        console.error(err);
        Swal.fire('Error PDF', err.message || 'Gagal memproses penggabungan dokumen.', 'error');
      }
    }
  </script>
